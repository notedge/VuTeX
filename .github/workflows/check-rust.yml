name: Check Rust

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  rust-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The PDF pipeline discovers a system `glyf` TrueType CJK face. Linux
      # runners ship none by default, so install the two fonts the discovery
      # list probes before running the workspace tests.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-droid-fallback fonts-wqy-zenhei
      - run: cargo test --workspace
