name: Check TypeScript

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      # `@vutex/vutex-unknown-wasm32` types live under gitignored `lib/`; build
      # wasm before typecheck/test so the module resolves on a clean checkout.
      - name: Build wasm bindings
        run: pnpm build:wasm
      - name: Typecheck packages
        run: pnpm typecheck
      - name: Test packages
        run: pnpm --filter @vutex/vutex --filter @vutex/wetex test
      - name: Build native bindings (linux)
        run: pnpm build:napi
