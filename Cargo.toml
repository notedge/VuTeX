[workspace]
resolver = "2"
# Only the export surfaces still belong to this repository. The `vutex-*`
# crates moved upstream to `document.rs`, so they are consumed as git
# dependencies instead of workspace members.
members = [
    "projects/vutex.rs/exports/watex-wasm",
    "projects/vutex.rs/exports/vutex-napi",
]
default-members = [
    "projects/vutex.rs/exports/watex-wasm",
    "projects/vutex.rs/exports/vutex-napi",
]

[workspace.lints.rust]
missing_docs = "allow"

[workspace.package]
version = "0.0.14"
edition = "2024"
license = "MPL-2.0"
authors = ["Aster <192607617@qq.com>"]
repository = "https://github.com/notedge/VuTeX"
homepage = "https://github.com/notedge/VuTeX"
readme = "readme.md"
keywords = ["typesetting", "layout", "document", "rendering", "vutex"]
categories = ["text-processing", "rendering"]
publish = false

[workspace.dependencies]
notedown-ir = { git = "https://github.com/notedge/notedown.git", rev = "e1e2b4cc52d0c9fad002d243f73f094d45df83a0" }
notedown-formats = { git = "https://github.com/notedge/notedown.git", rev = "e1e2b4cc52d0c9fad002d243f73f094d45df83a0", default-features = false, features = ["markdown", "notedown", "html", "tex", "typst"] }
davinci-types = { git = "https://github.com/notedge/notedown.git", rev = "e1e2b4cc52d0c9fad002d243f73f094d45df83a0" }
davinci-scene = { git = "https://github.com/notedge/notedown.git", rev = "e1e2b4cc52d0c9fad002d243f73f094d45df83a0" }
davinci-diagram = { git = "https://github.com/notedge/notedown.git", rev = "e1e2b4cc52d0c9fad002d243f73f094d45df83a0", default-features = false, features = ["mermaid", "dot", "plantuml"] }
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
acorn-ttf = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "6798c29abede61043893796b8191aa9acdb8f4fa", default-features = false, features = ["outline-cff"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2.129"
napi = { version = "3.14.2", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "3.6.12"
napi-build = "2"

# Upstream document family. The keys keep the historical `vutex-*` extern names
# so the export sources stay untouched while the implementation moves to
# `document.rs`.
vutex-types = { package = "document-types", git = "https://github.com/notedge/document.rs.git", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894" }
vutex-compose = { package = "document-compose", git = "https://github.com/notedge/document.rs.git", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894" }
vutex-text = { package = "document-text", git = "https://github.com/notedge/document.rs.git", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894" }
vutex-layout = { package = "document-layout", git = "https://github.com/notedge/document.rs.git", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894" }
vutex-presentation = { package = "document-presentation", git = "https://github.com/notedge/document.rs.git", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894" }
vutex-render-svg = { package = "document-renderer-svg", git = "https://github.com/notedge/document.rs.git", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894" }
vutex-render-html = { package = "document-renderer-html", git = "https://github.com/notedge/document.rs.git", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894" }
vutex-render-pdf = { package = "document-renderer-pdf", git = "https://github.com/notedge/document.rs.git", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894" }
document-formats = { git = "https://github.com/notedge/document.rs.git", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894", default-features = false, features = ["tex"] }
watex-wasm = { path = "projects/vutex.rs/exports/watex-wasm" }
vutex-napi = { path = "projects/vutex.rs/exports/vutex-napi" }

[profile.release]
lto = true
panic = "abort"
