[workspace]
resolver = "2"
# Only the export surfaces still belong to this repository. The `vutex-*`
# crates moved upstream to `document.rs`, so they are consumed as git
# dependencies instead of workspace members.
members = [
    "projects/vutex.rs/exports/watex-wasm",
    "projects/vutex.rs/exports/vutex-napi",
]
default-members = [
    "projects/vutex.rs/exports/watex-wasm",
    "projects/vutex.rs/exports/vutex-napi",
]

[workspace.lints.rust]
missing_docs = "allow"

[workspace.package]
version = "0.0.14"
edition = "2024"
license = "MPL-2.0"
authors = ["Aster <192607617@qq.com>"]
repository = "https://github.com/notedge/VuTeX"
homepage = "https://github.com/notedge/VuTeX"
readme = "readme.md"
keywords = ["typesetting", "layout", "document", "rendering", "vutex"]
categories = ["text-processing", "rendering"]
publish = false

[workspace.dependencies]
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
acorn-ttf = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "6798c29abede61043893796b8191aa9acdb8f4fa", default-features = false, features = ["outline-cff"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2.129"
napi = { version = "3.14.2", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "3.6.12"
napi-build = "2"

# Upstream document family. The keys keep the historical `vutex-*` extern names
# so the export sources stay untouched while the implementation moves to
# `document.rs`.
document-fonts = { package = "document-fonts", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
vutex-types = { package = "document-types", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
vutex-compose = { package = "document-compose", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
vutex-text = { package = "document-text", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
vutex-layout = { package = "document-layout", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
vutex-presentation = { package = "document-presentation", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
vutex-render-svg = { package = "document-renderer-svg", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
vutex-render-html = { package = "document-renderer-html", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
vutex-render-pdf = { package = "document-renderer-pdf", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
document-formats = { package = "document-formats", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d", default-features = false, features = ["markdown", "notedown", "html", "tex", "typst"] }
document-ir = { package = "document-ir", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
plotter-scene = { package = "plotter-scene", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
plotter-types = { package = "plotter-types", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
plotter-diagram = { package = "plotter-diagram", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
plotter-input-dot = { package = "plotter-input-dot", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
plotter-input-mermaid = { package = "plotter-input-mermaid", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
plotter-input-plantuml = { package = "plotter-input-plantuml", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
plotter-input-tikz = { package = "plotter-input-tikz", git = "https://github.com/notedge/document.rs.git", rev = "a5b7ef7f97827ab8e2d61c9abe991ee7e8b17a4d" }
watex-wasm = { path = "projects/vutex.rs/exports/watex-wasm" }
vutex-napi = { path = "projects/vutex.rs/exports/vutex-napi" }

[profile.release]
lto = true
panic = "abort"
