[package]
name = "watex-wasm"
version.workspace = true
authors.workspace = true
description = "WASM facade for VuTeX formula rendering (WaTeX product surface)"
license.workspace = true
edition.workspace = true
readme = "readme.md"
homepage = "https://github.com/notedge/VuTeX"
repository = "https://github.com/notedge/VuTeX"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acorn-ttf = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
vutex-layout = { workspace = true }
vutex-render-svg = { workspace = true }
vutex-text = { workspace = true }
vutex-compose = { workspace = true }
# `document-layout` uses `document-formats::lower_tex_formula_source` but declares
# that dependency with `default-features = false` only, so the `tex` feature is
# claimed here to keep the math pipeline compiling. Drop this line once the upstream
# crate declares the feature itself.
document-formats = { workspace = true, features = ["tex"] }
wasm-bindgen = { workspace = true }
