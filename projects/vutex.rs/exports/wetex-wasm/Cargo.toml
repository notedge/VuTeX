[package]
name = "wetex-wasm"
version.workspace = true
authors.workspace = true
description = "WASM facade for VuTeX formula rendering (WeTeX product surface)"
license.workspace = true
edition.workspace = true
readme = "readme.md"
homepage = "https://github.com/notedge/VuTeX"
repository = "https://github.com/notedge/VuTeX"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acorn-ttf = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
vutex-layout = { workspace = true }
vutex-render-svg = { workspace = true }
vutex-text = { workspace = true }
vutex-types = { workspace = true, features = ["serde"] }
wasm-bindgen = { workspace = true }
